<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

    <script>
        "use strict";

        const addFormButton = document.querySelector(".add-form-button");
        const commentsList = document.querySelector(".comments");
        const commentsState = [
      {
        id: 1,
        name: "Глеб Фокин",
        text: "Это будет первый комментарий на этой странице",
        date: "12.02.22 12:18",
        likesCount: 3,
        isLiked: false
      },
      {
        id: 2,
        name: "Варвара Н.",
        text: "Мне нравится как оформлена эта страница! ❤",
        date: "13.02.22 19:22",
        likesCount: 75,
        isLiked: true
      }
    ];
        function renderComments() {
      commentsList.innerHTML = "";

      commentsState.forEach((comment) => {
        const li = document.createElement("li");
        li.className = "comment";

        const header = document.createElement("div");
        header.className = "comment-header";

        const nameDiv = document.createElement("div");
        nameDiv.textContent = comment.name;

        const dateDiv = document.createElement("div");
        dateDiv.textContent = comment.date;

        header.appendChild(nameDiv);
        header.appendChild(dateDiv);

        const body = document.createElement("div");
        body.className = "comment-body";

        const textDiv = document.createElement("div");
        textDiv.className = "comment-text";
        textDiv.textContent = comment.text;

        body.appendChild(textDiv);

        const footer = document.createElement("div");
        footer.className = "comment-footer";

        const likesWrap = document.createElement("div");
        likesWrap.className = "likes";

        const likesCounter = document.createElement("span");
        likesCounter.className = "likes-counter";
        likesCounter.textContent = comment.likesCount;

        const likeButton = document.createElement("button");
        likeButton.className = "like-button";
        // 3) Класс для иконки лайка зависит от isLiked
        if (comment.isLiked) likeButton.classList.add("-active-like");

        // Чтобы обработчик знал, какой комментарий лайкнули:
        likeButton.dataset.id = String(comment.id);

        likesWrap.appendChild(likesCounter);
        likesWrap.appendChild(likeButton);

        footer.appendChild(likesWrap);

        li.appendChild(header);
        li.appendChild(body);
        li.appendChild(footer);

        commentsList.appendChild(li);
      });
    }

        renderComments(); 
        commentsList.addEventListener("click", (event) => {
      const btn = event.target.closest(".like-button");
      if (!btn) return;

      const id = Number(btn.dataset.id);
      const comment = commentsState.find((c) => c.id === id);
      if (!comment) return;

      // Изменяем значения ключей в массиве
      if (comment.isLiked) {
        comment.likesCount -= 1;
        comment.isLiked = false;
      } else {
        comment.likesCount += 1;
        comment.isLiked = true;
      }

      // Перерендер всех комментариев
      renderComments();
    });

        addFormButton.addEventListener("click", function () {
      const nameInput = document.querySelector(".add-form-name");
      const textInput = document.querySelector(".add-form-text");

      const name = nameInput.value.trim();
      const text = textInput.value.trim();

      if (!name || !text) {
        alert("Пожалуйста, заполните имя и текст комментария.");
        return;
      }

      const nextId =
        commentsState.length > 0
          ? Math.max(...commentsState.map((c) => c.id)) + 1
          : 1;

      commentsState.push({
        id: nextId,
        name,
        text,
        date: new Date().toLocaleString("ru-RU", {
          day: "2-digit",
          month: "2-digit",
          year: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }),
        likesCount: 0,
        isLiked: false
      });

      nameInput.value = "";
      textInput.value = "";

      renderComments();
    });
    </script>
</html>
