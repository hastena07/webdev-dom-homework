<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="comments-loading" id="global-loader" style="display: none;">
        Загрузка комментариев...
      </div>

      <ul class="comments" id="comments-list"></ul>

      <div class="add-form" id="add-form-container" style="display: none;">
        <input
          type="text"
          class="add-form-name"
          id="comment-name"
          placeholder="Введите ваше имя"
          readonly
        />
        <textarea
          class="add-form-text"
          id="comment-text"
          placeholder="Введите ваш комментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button" id="add-comment-btn">Написать</button>
        </div>
        <div class="form-loading" style="display: none;">Комментарий добавляется...</div>
        <button class="add-form-button-exit" id="logout-btn">Выйти</button>
      </div>

      <div id="auth-area" style="display: none;"></div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
